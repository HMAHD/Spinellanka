name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assert Hosting Capability Gate Passed
        run: |
          if ! grep -q 'Verdict: Accepted' docs/planning/05-cpanel-deployment-and-operations.md; then
            echo "::error::Deployment blocked! Hosting acceptance gate has not passed."
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies & Build Release Artifact
        run: |
          npm ci --ignore-scripts
          ./scripts/package-release --output-dir dist

      - name: Verify Checksum Prior to Transfer
        run: |
          cd dist
          sha256sum -c release.tar.gz.sha256

      - name: Upload Release via SFTP
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY:  ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Upload release archive + checksum via SFTP (no shell needed)
          sftp -i ~/.ssh/deploy_key \
            -P "$CPANEL_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" <<SFTP
          put dist/release.tar.gz $CPANEL_DEPLOY_PATH/.incoming/release.tar.gz
          put dist/release.tar.gz.sha256 $CPANEL_DEPLOY_PATH/.incoming/release.tar.gz.sha256
          SFTP

          echo "Archive uploaded successfully"

      - name: Upload Deploy Webhook to public_html
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY:  ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Inject the webhook secret into the script before uploading
          WEBHOOK_SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          sed "s|getenv('DEPLOY_WEBHOOK_SECRET') ?: .*|getenv('DEPLOY_WEBHOOK_SECRET') ?: '$WEBHOOK_SECRET';|" \
            scripts/deploy-webhook.php > /tmp/deploy-webhook-live.php

          sftp -i ~/.ssh/deploy_key \
            -P "$CPANEL_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" <<SFTP
          put /tmp/deploy-webhook-live.php /home/spinellanka/public_html/_deploy.php
          SFTP

          echo "Webhook uploaded"

      - name: Trigger Deployment via Webhook
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          RELEASE_ID="${{ github.sha }}"
          RELEASE_ID="${RELEASE_ID:0:14}"

          echo "Triggering deploy for release $RELEASE_ID ..."

          RESPONSE=$(curl -sf \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_SECRET" \
            -d "release_id=$RELEASE_ID" \
            --max-time 300 \
            "http://spinellanka.lk/_deploy.php" 2>&1) || {
            echo "::error::Webhook call failed. Response: $RESPONSE"
            exit 1
          }

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "Deploy.*complete"; then
            echo "✅ Deployment successful!"
          else
            echo "::error::Unexpected webhook response"
            exit 1
          fi

      - name: Remove Deploy Webhook
        if: always()
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY:  ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          sftp -i ~/.ssh/deploy_key \
            -P "$CPANEL_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" <<SFTP
          rm /home/spinellanka/public_html/_deploy.php
          SFTP

          echo "Webhook removed"
