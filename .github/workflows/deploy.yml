name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assert Hosting Capability Gate Passed
        run: |
          if ! grep -q 'Verdict: Accepted' docs/planning/05-cpanel-deployment-and-operations.md; then
            echo "::error::Deployment blocked! Hosting acceptance gate has not passed."
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies & Build Release Artifact
        run: |
          npm ci --ignore-scripts
          ./scripts/package-release --output-dir dist

      - name: Verify Checksum Prior to Transfer
        run: |
          cd dist
          sha256sum -c release.tar.gz.sha256

      - name: Upload Release & Activation Request via SFTP
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          CPANEL_PHP_BIN: ${{ secrets.CPANEL_PHP_BIN }}
        run: |
          RELEASE_ID="${{ github.sha }}"
          RELEASE_ID="${RELEASE_ID:0:14}"
          PHP_BIN="${CPANEL_PHP_BIN:-/usr/local/bin/ea-php83}"

          cat > /tmp/deploy-request.json <<JSON
          {"release_id":"$RELEASE_ID","php_bin":"$PHP_BIN","requested_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON

          mkdir -p ~/.ssh
          echo "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          sftp -i ~/.ssh/deploy_key \
            -P "$CPANEL_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" <<SFTP
          -rm $CPANEL_DEPLOY_PATH/.incoming/deploy-result-$RELEASE_ID.json
          put dist/release.tar.gz $CPANEL_DEPLOY_PATH/.incoming/release.tar.gz
          put dist/release.tar.gz.sha256 $CPANEL_DEPLOY_PATH/.incoming/release.tar.gz.sha256
          put scripts/deploy-activate.php $CPANEL_DEPLOY_PATH/shared/deploy-activate.php
          put /tmp/deploy-request.json $CPANEL_DEPLOY_PATH/.incoming/deploy-request.json
          SFTP

          echo "Release $RELEASE_ID and activation request queued via SFTP."

      - name: Wait for Cron Activation Result via SFTP
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          RELEASE_ID="${{ github.sha }}"
          RELEASE_ID="${RELEASE_ID:0:14}"
          REMOTE_RESULT="$CPANEL_DEPLOY_PATH/.incoming/deploy-result-$RELEASE_ID.json"
          LOCAL_RESULT="/tmp/deploy-result-$RELEASE_ID.json"

          for i in $(seq 1 30); do
            rm -f "$LOCAL_RESULT"
            sftp -i ~/.ssh/deploy_key \
              -P "$CPANEL_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" >/dev/null 2>&1 <<SFTP || true
          -get $REMOTE_RESULT $LOCAL_RESULT
          SFTP

            if [[ -f "$LOCAL_RESULT" ]]; then
              php -r '
                $data = json_decode(file_get_contents($argv[1]), true);
                if (!is_array($data)) {
                    fwrite(STDERR, "Invalid deploy-result JSON.\n");
                    exit(1);
                }
                echo ($data["log"] ?? "") . "\n";
                if (($data["status"] ?? "") !== "ok") {
                    exit(1);
                }
              ' "$LOCAL_RESULT"

              sftp -i ~/.ssh/deploy_key \
                -P "$CPANEL_SSH_PORT" \
                -o StrictHostKeyChecking=accept-new \
                -o BatchMode=yes \
                "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" >/dev/null 2>&1 <<SFTP || true
          -rm $REMOTE_RESULT
          SFTP
              echo "✅ Deployment successful!"
              exit 0
            fi

            sleep 5
          done

          echo "::error::Timed out waiting for cPanel cron activator ($CPANEL_DEPLOY_PATH/shared/deploy-activate.php). Ensure the 1-minute cPanel cron job is configured."
          exit 1
