name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP formatting
        run: composer lint

      - name: Run static analysis
        run: composer analyse
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Run tests
        run: composer test

      - name: Audit PHP dependencies
        run: composer audit --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  release-artifact:
    name: Package & Verify Release Artifact
    runs-on: ubuntu-latest
    needs: [php, frontend]

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Package Release Artifact
        run: ./scripts/package-release --output-dir dist

      - name: Verify Checksum Integrity
        run: |
          cd dist
          sha256sum -c release.tar.gz.sha256

      - name: Verify Corrupted Checksum Rejection
        run: |
          cd dist
          cp release.tar.gz release.tar.gz.bak
          echo "corruption_payload" >> release.tar.gz
          if sha256sum -c release.tar.gz.sha256; then
            echo "::error::Corrupted archive passed checksum verification!"
            exit 1
          fi
          echo "Corrupted checksum was rejected as expected."
          mv release.tar.gz.bak release.tar.gz

      - name: Verify Strict Artifact Exclusions
        run: |
          mkdir -p check-artifact
          tar -xzf dist/release.tar.gz -C check-artifact

          # Assert excluded files are NOT present
          if find check-artifact -name ".env*" | grep -q .; then
            echo "::error::Release artifact contains .env files!"
            exit 1
          fi
          if [[ -d check-artifact/tests ]]; then
            echo "::error::Release artifact contains tests/ directory!"
            exit 1
          fi
          if [[ -d check-artifact/.git ]]; then
            echo "::error::Release artifact contains .git directory!"
            exit 1
          fi
          if [[ -d check-artifact/node_modules ]]; then
            echo "::error::Release artifact contains node_modules!"
            exit 1
          fi
          if find check-artifact -name "*.sqlite*" | grep -q .; then
            echo "::error::Release artifact contains sqlite files!"
            exit 1
          fi
          if [[ -f check-artifact/phpunit.xml || -f check-artifact/phpstan.neon ]]; then
            echo "::error::Release artifact contains development configuration files!"
            exit 1
          fi

          # Assert required production elements ARE present
          test -f check-artifact/artisan
          test -x check-artifact/artisan
          test -f check-artifact/public/build/manifest.json
          test -d check-artifact/vendor
          test -f check-artifact/vendor/autoload.php

          echo "All artifact inclusion and exclusion rules verified successfully."

      - name: Upload Verified Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            dist/release.tar.gz
            dist/release.tar.gz.sha256
          retention-days: 5
